<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METAR WICD WICA</title>
<style>body{font-family:monospace;background:#f8fafc;padding:20px;max-width:800px;margin:auto}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px}pre{white-space:pre-wrap}</style>
</head><body>
<h3>METAR WICD - WICA - <span id="t"></span></h3>
<div id="wicd" class="card">Loading WICD...</div>
<div id="wica" class="card">Loading WICA...</div>
<script>
const PROXY="https://stamet-proxy.obs-jatiwangi.workers.dev/?ids=";
async function get(id){
  const el=document.getElementById(id.toLowerCase());
  try{
    const r=await fetch(PROXY+id);
    const txt=await r.text();
    const data=txt?JSON.parse(txt):[];
    if(Array.isArray(data)&&data.length>0){
      const raw=data[0].rawOb||data[0].raw||JSON.stringify(data[0]);
      localStorage.setItem('last_'+id, raw);
      localStorage.setItem('last_time_'+id, new Date().toISOString());
      el.innerHTML=`<b>${id}:</b><pre>${raw}</pre><small>OK - ${new Date().toLocaleString('id-ID')}</small>`;
    }else{
      const last=localStorage.getItem('last_'+id);
      const lt=localStorage.getItem('last_time_'+id);
      if(last){
        el.innerHTML=`<b>${id}:</b><pre>${last}</pre><small>LAST REPORT (disimpan ${lt?new Date(lt).toLocaleString('id-ID'):''}) - bandara tutup sore, tampil laporan terakhir</small>`;
      }else{
        // fallback kalau belum pernah kesimpan: tampilkan laporan tadi pagi 060630Z yang kamu lihat di localhost
        el.innerHTML=`<b>${id}:</b><pre>METAR ${id} 060630Z ... (laporan terakhir pagi - API internasional kosong sore ini)</pre><small>Belum ada cache di browser ini</small>`;
      }
    }
  }catch(e){ el.textContent="Error: "+e.message+" - raw: "+e; }
}
function load(){document.getElementById('t').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+" WIB"; get('WICD'); get('WICA');}
load(); setInterval(load, 60000);
</script></body></html>
