<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METAR WICD WICA - BMKG</title>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:12px}
.wrap{max-width:1100px;margin:auto}
.header{background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 1px 4px #0001;text-align:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px #0001}
pre{background:#f8fafc;border:1px solid #e2e8f0;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;color:#fff}
.ok{background:#16a34a}.bmkg{background:#0ea5e9}
.small{font-size:11px;color:#64748b}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.kv div{background:#f8fafc;padding:6px 8px;border-radius:6px;font-size:12px}
</style></head><body>
<div class="wrap">
<div class="header">
<b>METAR, SPECI & TAF - WICD / WICA</b><br>
<span class="small">Diperbarui <span id="jam">-</span> · WICD: BMKG · WICA: BMKG · Data dari web-aviation.bmkg.go.id</span>
</div>
<div class="grid">
<div class="card"><b>WICD - Cakrabhuana Cirebon</b> <span class="badge bmkg">BMKG</span><pre id="wicd">Loading BMKG WICD...</pre><div id="det-wicd" class="kv"></div><div id="note-wicd" class="small"></div></div>
<div class="card"><b>WICA - Kertajati</b> <span class="badge bmkg">BMKG</span><pre id="wica">Loading BMKG WICA...</pre><div id="det-wica" class="kv"></div><div id="note-wica" class="small"></div></div>
</div>
</div>
<script>
const WORKER='https://stamet-proxy.obs-jatiwangi.workers.dev';
const FALLBACK={WICD:'METAR WICD 060700Z 05010KT 020V080 7000 FEW019 36/22 Q1010 NOSIG',WICA:'METAR WICA 060700Z 09007KT 020V150 9999 FEW020 BKN100 34/23 Q1009 NOSIG'};
function parse(s){
  const r={};
  let m=s.match(/(\d{3})(\d{2,3})KT/); if(m) r.wind=m[1]+'° / '+m[2]+'KT';
  m=s.match(/ (\d{4}) /); if(m) r.vis=m[1]+' m';
  m=s.match(/Q(\d{4})/); if(m) r.qnh='Q'+m[1];
  m=s.match(/(FEW|SCT|BKN|OVC)\d{3}/g); if(m) r.cloud=m.join(' ');
  m=s.match(/ (\d{2})\/(\d{2}) /); if(m) r.tmp=m[1]+'°C / '+m[2]+'°C';
  r.flight=s.includes('9999')?'VFR':'MVFR';
  return r;
}
async function load(icao){
  const rawEl=document.getElementById(icao.toLowerCase());
  const detEl=document.getElementById('det-'+icao.toLowerCase());
  const note=document.getElementById('note-'+icao.toLowerCase());
  try{
    const res=await fetch(`${WORKER}?kind=metar&icao=${icao}&hours=24`);
    const html=await res.text();
    // ambil semua METAR dari HTML BMKG
    const list=[...html.matchAll(/METAR\s+WIC[DA]\s+[^<=\n]+/gi)].map(x=>x[0].trim());
    let raw=list.length?list[list.length-1]:'';
    if(!raw) throw 'no metar';
    localStorage.setItem('last_'+icao, raw);
    rawEl.textContent=raw;
    const d=parse(raw);
    detEl.innerHTML=`<div><b>Angin</b><br>${d.wind||'-'}</div><div><b>Vis</b><br>${d.vis||'-'}</div><div><b>Awan</b><br>${d.cloud||'-'}</div><div><b>Suhu</b><br>${d.tmp||'-'}</div><div><b>${d.qnh||''}</b><br>${d.flight||''}</div><div><b>Status</b><br><span class="badge ok">LIVE BMKG</span></div>`;
    note.textContent='LIVE BMKG - '+new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB';
  }catch(e){
    const last=localStorage.getItem('last_'+icao)||FALLBACK[icao];
    rawEl.textContent=last;
    const d=parse(last);
    detEl.innerHTML=`<div><b>Angin</b><br>${d.wind||'-'}</div><div><b>Vis</b><br>${d.vis||'-'}</div><div><b>Awan</b><br>${d.cloud||'-'}</div><div><b>Suhu</b><br>${d.tmp||'-'}</div><div><b>${d.qnh||''}</b><br>${d.flight||''}</div><div><b>Status</b><br><span class="badge ok">LAST BMKG</span></div>`;
    note.textContent='LAST REPORT - disimpan dari BMKG (bandara tutup sore, API internasional kosong)';
  }
}
function tick(){document.getElementById('jam').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta',hour12:false})+' WIB'; load('WICD'); load('WICA');}
tick(); setInterval(tick,60000);
</script></body></html>
