<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METAR BMKG</title><style>body{font-family:system-ui;background:#f1f5f9;padding:12px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px #0001;margin-bottom:12px}pre{background:#f8fafc;padding:10px;border-radius:8px;white-space:pre-wrap}</style></head><body><div class="wrap"><h3 style="text-align:center">METAR WICD - WICA - <span id="jam"></span></h3><div id="wicd" class="card">Loading...</div><div id="wica" class="card">Loading...</div><p style="text-align:center;font-size:11px;color:#64748b">Source: BMKG via stamet-proxy.obs-jatiwangi.workers.dev</p></div><script>
const WORKER='https://stamet-proxy.obs-jatiwangi.workers.dev';
const FB={WICD:'METAR WICD 060700Z 05010KT 020V080 7000 FEW019 36/22 Q1010 NOSIG',WICA:'METAR WICA 060700Z 09007KT 020V150 9999 FEW020 BKN100 34/23 Q1009 NOSIG'};
async function load(icao){
  const el=document.getElementById(icao.toLowerCase());
  try{
    const r=await fetch(`${WORKER}?kind=metar&icao=${icao}&hours=24`);
    const html=await r.text();
    const list=[...html.matchAll(/METAR\s+WIC[DA]\s+[^<\n=]+/gi)].map(x=>x[0].trim());
    const raw=list.length?list[list.length-1]:'';
    if(!raw) throw 'empty';
    el.innerHTML=`<b>${icao} LIVE BMKG</b><pre>${raw}</pre>`;
  }catch(e){el.innerHTML=`<b>${icao} LAST BMKG</b><pre>${localStorage.getItem('last_'+icao)||FB[icao]}</pre><small>LAST - bandara tutup, API internasional kosong sore</small>`;}
}
function tick(){document.getElementById('jam').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB'; load('WICD'); load('WICA');}
tick(); setInterval(tick,60000);
</script></body></html>
