<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR WICD - WICA | Stamet Kertajati</title>
<style>
body{font-family:system-ui;margin:0;background:#0b172a;color:#e9f0ff;padding:20px}
.card{max-width:800px;margin:auto;background:#12233f;border-radius:16px;padding:20px}
pre{background:#0a1428;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap}
button{background:#2a7cff;border:0;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:#0e1c34;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>METAR WICD & WICA</h1>
<div style="margin:12px 0"><button onclick="load()">🔄 Refresh</button> <span id="status"></span></div>
<div class="grid">
<div class="box"><b>WICD</b><div id="wicd">Memuat...</div><pre id="raw-wicd">-</pre></div>
<div class="box"><b>WICA</b><div id="wica">Memuat...</div><pre id="raw-wica">-</pre></div>
</div>
<pre id="raw-all" style="margin-top:14px">-</pre>
</div>
<script>
const PROXY = 'https://stamet-proxy.obs-jatiwangi.workers.dev/?ids=WICD,WICA,WIII';
async function load(){
  try{
    const r = await fetch(PROXY,{cache:'no-store'});
    const txt = await r.text();
    document.getElementById('raw-all').textContent=txt;
    let data=JSON.parse(txt); if(!Array.isArray(data)) data=[data];
    const byId={}; data.forEach(d=>{ if(d.icaoId) byId[d.icaoId]=d; });
    function render(id,elRaw,elInfo){
      const d=byId[id];
      if(!d){document.getElementById(elInfo).textContent='Tidak ada data jam ini'; document.getElementById(elRaw).textContent='-'; return;}
      document.getElementById(elInfo).textContent=d.obsTime||''; document.getElementById(elRaw).textContent=d.rawOb||'';
    }
    render('WICD','raw-wicd','wicd'); render('WICA','raw-wica','wica');
    document.getElementById('status').textContent='OK '+new Date().toLocaleString('id-ID');
  }catch(e){document.getElementById('status').textContent='ERROR: '+e.message}
}
load(); setInterval(load,300000);
</script>
</body>
</html>
