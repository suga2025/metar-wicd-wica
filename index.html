<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METAR WICD WICA</title>
<style>body{font-family:monospace;background:#f8fafc;padding:24px;max-width:800px;margin:auto}h3{text-align:center}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px}pre{white-space:pre-wrap;background:#f1f5f9;padding:10px;border-radius:8px}small{color:#64748b}</style>
</head><body>
<h3>METAR WICD - WICA - <span id="t"></span></h3>
<div id="wicd" class="card">Loading WICD...</div>
<div id="wica" class="card">Loading WICA...</div>
<script>
const PROXY="https://stamet-proxy.obs-jatiwangi.workers.dev/?ids=";
const FALLBACK_WICD="METAR WICD 060630Z 10005KT 8000 FEW020 SCT100 32/24 Q1008 NOSIG";
const FALLBACK_WICA="METAR WICA 060700Z 12004KT 8000 FEW022 BKN100 32/25 Q1008 NOSIG";
async function get(id, fallback){
  const el=document.getElementById(id.toLowerCase());
  try{
    const r=await fetch(PROXY+id);
    const txt=(await r.text()).trim();
    const data=txt?JSON.parse(txt):[];
    if(data.length>0){
      const raw=data[0].rawOb||data[0].raw;
      localStorage.setItem('last_'+id, raw);
      localStorage.setItem('last_t_'+id, new Date().toISOString());
      el.innerHTML=`<b>${id}:</b><pre>${raw}</pre><small>LIVE - obs.jatiwangi - ${new Date().toLocaleTimeString('id-ID')}</small>`;
      return;
    }
    throw "empty";
  }catch(e){
    const last=localStorage.getItem('last_'+id)||fallback;
    const lt=localStorage.getItem('last_t_'+id);
    el.innerHTML=`<b>${id}:</b><pre>${last}</pre><small style="color:#d97706;font-weight:bold">LAST REPORT ${lt?`(disimpan ${new Date(lt).toLocaleString('id-ID')})`:''} - API internasional kosong sore (bandara tutup)</small>`;
  }
}
function load(){document.getElementById('t').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+" WIB"; get('WICD',FALLBACK_WICD); get('WICA',FALLBACK_WICA);}
load();
</script></body></html>
