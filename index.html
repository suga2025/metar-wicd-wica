<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METAR WICD WICA</title>
<style>body{font-family:monospace;padding:20px;max-width:800px;margin:auto;background:#f8fafc} .card{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px} .nil{color:#999} .ok{color:#16a34a;font-weight:bold}</style>
</head><body>
<h2>METAR WICD - WICA <span id="time"></span></h2>
<div id="wicd" class="card">Loading WICD...</div>
<div id="wica" class="card">Loading WICA...</div>
<script>
const PROXY="https://stamet-proxy.obs-jatiwangi.workers.dev/?ids=WICD,WICA";
const HOURS=12;
async function load(){
  document.getElementById('time').textContent=" - "+new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+" WIB";
  try{
    const r=await fetch(PROXY);
    const data=await r.json();
    // kalau API kasih array
    if(Array.isArray(data) && data.length>0){
      data.forEach(o=>{
        const id=o.icaoId||o.stationId;
        const raw=o.rawOb||o.raw||JSON.stringify(o);
        localStorage.setItem('last_'+id, raw);
        localStorage.setItem('last_time_'+id, new Date().toISOString());
        document.getElementById(id.toLowerCase()).innerHTML=`<div class="ok">${id}: ${raw}</div><small>by obs.jatiwangi - ${new Date().toLocaleTimeString('id-ID')} WIB</small>`;
      });
    }
    // tampilkan yang kesimpan kalau API kosong (NO DATA)
    ['WICD','WICA'].forEach(id=>{
      const el=document.getElementById(id.toLowerCase());
      if(el.textContent.includes('Loading') || el.textContent.includes('NIL')){
        const last=localStorage.getItem('last_'+id);
        const lt=localStorage.getItem('last_time_'+id);
        if(last){
          el.innerHTML=`<div class="ok">${id}: ${last}</div><small class="nil">LAST REPORT (disimpan ${lt?new Date(lt).toLocaleString('id-ID'):''}) - bandara sudah tutup, data internasional kosong</small>`;
        }else{
          el.innerHTML=`<div class="nil">${id}: NIL (belum ada laporan hari ini tersimpan)</div>`;
        }
      }
    });
  }catch(e){
    document.getElementById('wicd').textContent='Error: '+e.message;
  }
}
load(); setInterval(load, 5*60*1000);
</script></body></html>
