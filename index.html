<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METAR WICD WICA - Keep Last</title>
<style>body{font-family:system-ui,sans-serif;background:#f8fafc;padding:24px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 6px #0001}pre{background:#f1f5f9;padding:12px;border-radius:8px;white-space:pre-wrap}.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}.ok{background:#16a34a}.last{background:#f59e0b}.nil{background:#2563eb}</style>
</head><body>
<h1>METAR, SPECI & TAF</h1>
<p>Bandara Cakrabhuana Cirebon (WICD) dan Kertajati (WICA) - <span id="jam"></span></p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="card"><h2>WICD <span id="b-wicd" class="badge nil">NIL</span></h2><pre id="wicd">Loading...</pre><small id="n-wicd"></small></div>
<div class="card"><h2>WICA <span id="b-wica" class="badge nil">NIL</span></h2><pre id="wica">Loading...</pre><small id="n-wica"></small></div>
</div>
<script>
const PROXY="https://stamet-proxy.obs-jatiwangi.workers.dev/?ids=";
// Fallback laporan terakhir yang kamu lihat di localhost:8080 pagi ini
const FALLBACK={
  WICD: "METAR WICD 060630Z 10005KT 8000 FEW020 SCT100 32/24 Q1008 NOSIG (last cached - obs.jatiwangi)",
  WICA: "METAR WICA 060700Z 12004KT 8000 FEW022 BKN100 32/25 Q1008 NOSIG (last cached - obs.jatiwangi)"
};
async function loadOne(id){
  const el=document.getElementById(id.toLowerCase());
  const b=document.getElementById('b-'+id.toLowerCase());
  const n=document.getElementById('n-'+id.toLowerCase());
  try{
    const r=await fetch(PROXY+id);
    const txt=(await r.text()).trim();
    const data=txt?JSON.parse(txt):[];
    if(Array.isArray(data)&&data.length>0){
      const raw=data[0].rawOb||data[0].raw;
      localStorage.setItem('last_'+id, raw);
      localStorage.setItem('last_t_'+id, new Date().toISOString());
      el.textContent=raw; b.textContent="OK"; b.className="badge ok"; n.textContent="Live - "+new Date().toLocaleTimeString('id-ID');
    }else{
      throw "empty";
    }
  }catch(e){
    const last=localStorage.getItem('last_'+id)||FALLBACK[id];
    const lt=localStorage.getItem('last_t_'+id);
    el.textContent=last;
    b.textContent="LAST"; b.className="badge last";
    n.textContent=lt?`LAST REPORT disimpan ${new Date(lt).toLocaleString('id-ID')} - API kosong sore ini`:`LAST REPORT (fallback pagi 06/10 06:30Z) - API kosong karena bandara tutup`;
  }
}
function loadAll(){document.getElementById('jam').textContent=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+" WIB"; loadOne('WICD'); loadOne('WICA');}
loadAll(); setInterval(loadAll, 60000);
</script></body></html>
