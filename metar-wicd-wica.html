<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METAR, SPECI & TAF - WICD WICA</title><style>_{box-sizing:border-box}body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#fafafb;color:#111;padding:24px}h1{margin:0 0 6px;font-size:26px}.sub{color:#666;margin-bottom:20px;font-size:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.icao{font-weight:800;font-size:20px}.nm{color:#555;font-size:13px}.raw{font-family:ui-monospace,monospace;background:#f6f7f9;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px;margin:8px 0}.meta{font-size:12px;color:#666}.chip{display:inline-flex;gap:6px;background:#f3f4f6;border:1px solid #e5e7eb;padding:4px 8px;border-radius:999px;font-size:12px;margin:3px}b{font-weight:700}#clock{font-size:12px;color:#888;margin-bottom:16px}.btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}</style></head><body><h1>METAR, SPECI & TAF</h1><div class=sub>Data cuaca observasi penerbangan terkini — Bandar Udara Cakrabuana Penggung, Cirebon (WICD) dan Bandar Udara Kertajati, Majalengka (WICA)</div><div id=clock></div><div id=grid><span class=meta><span class=dot style="background:orange"></span>Memuat data...</span></div><div style="margin-top:12px"><button class=btn onclick="load(true)">Perbarui sekarang</button> <span id=status class=meta style="margin-left:8px"></span></div><script>const STATIONS=[{icao:'WICD',name:'Cakrabuana',city:'Cirebon'},{icao:'WICA',name:'Kertajati',city:'Majalengka'}];const $=s=>document.querySelector(s);const pad=n=>String(n).padStart(2,'0');const PROXY='https://api.allorigins.win/raw?url=';const px=u=>PROXY+encodeURIComponent(u);function obsDate(ddhhmm){if(!ddhhmm||ddhhmm.length<6)return null;const n=new Date(),d=ddhhmm.slice(0,2),h=ddhhmm.slice(2,4),m=ddhhmm.slice(4,6);let t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),1,h,m));if(t.getUTCDate()!=+d){t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),+d,h,m));if(t>n)t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,+d,h,m))}else{t.setUTCDate(+d);if(t>n)t.setUTCMonth(t.getUTCMonth()-1)}return t}const wib=t=>`${pad((t.getUTCHours()+7)%24)}:${pad(t.getUTCMinutes())} WIB`;const utc=t=>`${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())} UTC`;function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return'baru saja';if(m<60)return m+' menit lalu';return Math.floor(m/60)+' jam '+(m%60)+' menit lalu'}function setMeta(e,rep,label,extra){const m=rep.match(/\b(\d{6}Z)/);if(!m){e.textContent='';return}const t=obsDate(m[1]),age=(Date.now()-t)/6e4;e.innerHTML=`${label}: ${t?wib(t)+' · '+utc(t):m[1]} · ${ago(t)}${extra?' · '+extra:''}`;e.style.color=age>90?'#c00':'#666'}async function fetchWithFallback(urls){let lastErr='';for(const u of urls){try{const r=await fetch(px(u),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const txt=await r.text();if(txt&&txt.length>10)return txt}catch(e){lastErr=e.message}}throw new Error(lastErr||'gagal')}function parseMetarJson(txt){try{const j=JSON.parse(txt);const arr=Array.isArray(j)?j:[j];return arr.map(o=>o.rawOb||o.raw||o.metar||'').filter(Boolean)}catch{return[]}}function parseTafJson(txt){try{const j=JSON.parse(txt);const arr=Array.isArray(j)?j:[j];return arr.map(o=>o.rawTAF||o.raw||o.taf||'').filter(Boolean)}catch{return[]}}async function getMetar(icao){try{const url=`https://aviationweather.gov/api/data/metar?ids=${icao}&format=json`;const txt=await fetchWithFallback();const raws=parseMetarJson(txt);if(raws.length)return raws}catch{}try{const url=`https://tgftp.nws.noaa.gov/data/observations/metar/stations/${icao}.TXT`;const txt=await fetchWithFallback([url]);const lines=txt.trim().split('\n');const metar=lines[lines.length-1].trim();if(metar)return metar}catch{}return null}async function getTaf(icao){try{const url=`https://aviationweather.gov/api/data/taf?ids=${icao}&format=json`;const txt=await fetchWithFallback();const raws=parseTafJson(txt);if(raws.length)return raws}catch{}try{const url=`https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/${icao}.TXT`;const txt=await fetchWithFallback([url]);const lines=txt.trim().split('\n');lines.shift();return lines.join(' ').replace(/\s+/g,' ').trim()}catch{}return null}function decode(metar){let chips=[];const vis=m=>{const v=m.match(/\b(\d{4})\b/);if(v)chips.push(['VIS',v[1]+' m']);const vv=m.match(/\b(P?\d+\/?\d_SM)\b/);if(vv)chips.push(['VIS',vv[1]])};vis(metar);(metar.match(/\b(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?\b/g)||[]).forEach(c=>chips.push(['AWAN',c]));const tmp=metar.match(/\b(M?\d+)\/(M?\d+)\b/);if(tmp)chips.push(['SUHU',tmp[0].replace('M','-')+'°C']);const qnh=metar.match(/\bQ(\d{4})\b/);if(qnh)chips.push(['QNH',qnh[1]+' hPa']);const qnh2=metar.match(/\bA(\d{4})\b/);if(qnh2)chips.push(['ALT',qnh2[0]]);const wind=metar.match(/\b(\d{3}|VRB)(\d{2,3})(G\d+)?KT\b/);if(wind)chips.push(['ANGIN',wind[0]]);return chips.map(([k,v])=>`<div class=chip><b>${k}</b><span>${v}</span></div>`).join('')}async function load(force){$('grid').innerHTML=STATIONS.map(s=>`<article class=card><div class=sh><div><div class=icao>${s.icao}</div><div class=nm>${s.name}<br>${s.city}</div></div><div class=meta>Memuat...</div></div><div class=raw>Memuat...</div><div class=chips></div><div class=meta style="margin-top:8px">TAF: memuat...</div><div class=raw taf>...</div></article>`).join('');const cards=document.querySelectorAll('.card');let i=0;for(const s of STATIONS){const card=cards[i++];const metaEl=card.querySelector('.meta');const rawEl=card.querySelector('.raw');const chipsEl=card.querySelector('.chips');const tafMeta=card.querySelectorAll('.meta')[1];const tafEl=card.querySelector('.taf');try{const metar=await getMetar(s.icao);if(metar){rawEl.textContent=metar;chipsEl.innerHTML=decode(metar);setMeta(metaEl,metar,'OBS')}else{rawEl.textContent='Tidak ada METAR'}}catch(e){rawEl.textContent='Gagal METAR: '+e.message}try{const taf=await getTaf(s.icao);if(taf){tafEl.textContent=taf;setMeta(tafMeta,taf,'TAF','')}else{tafEl.textContent='Tidak ada TAF'}}catch(e){tafEl.textContent='Gagal TAF: '+e.message}}$('#status').textContent='Update: '+new Date().toLocaleTimeString('id-ID')}function tick(){const n=new Date();$('#clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())} WIB · ${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())} UTC`}setInterval(tick,1000);tick();load();setInterval(()=>load(),5_60_1000);</script></body></html>[url][0]
