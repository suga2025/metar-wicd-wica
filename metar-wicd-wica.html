<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR, SPECI & TAF — WICD & WICA</title>
<style>
:root{--bg:#f7f7f7;--card:#fff;--ink:#1a1a1a;--mute:#6b7280;--line:#e5e7eb;--code:#f8f8f8;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1e;--ink:#f2f2f2;--mute:#9ca3af;--line:#2e2e32;--code:#161618}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}.wrap{max-width:1280px;margin:0 auto}h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.5px}.sub{color:var(--mute);font-size:13px;margin:0 0 14px}.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px;font-size:12px;color:var(--mute)}.stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.clock{font:600 13px Consolas,monospace;color:var(--ink)}.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.load{background:var(--warn)}button{font:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}button:hover{border-color:var(--mute)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;padding:0 4px}.icao{font-size:26px;font-weight:800;letter-spacing:1px;line-height:1}.nm{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.4}.sr{display:flex;align-items:center;gap:10px}.cat{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}.cat.VFR{background:#16a34a}.cat.MVFR{background:#2563eb}.cat.IFR{background:#dc2626}.cat.LIFR{background:#a21caf}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden}.card h3{margin:0;padding:14px 20px;font-size:12.5px;font-weight:700;letter-spacing:.3px;border-bottom:1px solid var(--line)}.body{padding:14px 20px 16px}pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:12px/1.6 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-word}.meta{font-size:12px;color:var(--mute);margin:0 2px 10px;min-height:1em}.meta.stale{color:var(--warn);font-weight:600}.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}.chip{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.chip b{display:block;font-size:10px;color:var(--mute);font-weight:600;margin-bottom:2px}.chip span{font-size:14px;font-weight:600}details{margin-top:12px;font-size:12px}summary{cursor:pointer;color:var(--mute)}details pre{margin-top:8px;font-size:11px}.err{color:var(--bad)}.foot{font-size:11px;color:var(--mute);line-height:1.6;margin:6px 4px 20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>METAR, SPECI & TAF</h1>
  <p class="sub">Data cuaca observasi penerbangan terkini — Bandar Udara Cakrabuana Penggung, Cirebon (WICD) dan Bandar Udara Kertajati, Majalengka (WICA)</p>
  <div class="bar">
    <div class="stat"><span id="dot" class="dot load"></span><span id="status">Memuat data…</span></div>
    <div class="stat"><span class="clock" id="clock"></span><span id="next"></span><button id="btn" type="button">Perbarui sekarang</button></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const STATIONS=[{icao:'WICD',name:'Bandar Udara Cakrabuana Penggung',city:'Cirebon'},{icao:'WICA',name:'Bandar Udara Internasional Jawa Barat (Kertajati)',city:'Majalengka'}];
const REFRESH=60;
const $=id=>document.getElementById(id);
const LOCAL=false;const PROXY_URL='https://api.allorigins.win/raw?url=';const px=u=>PROXY_URL+encodeURIComponent(u);
const AWC='https://aviationweather.gov/api/data/';
const NOAA='https://tgftp.nws.noaa.gov/data/';
let left=REFRESH,busy=false;
const pad=n=>String(n).padStart(2,'0');

// Tampilan
$('grid').innerHTML=STATIONS.map(s=>`<article><div class="sh"><div><div class="icao">${s.icao}</div><div class="nm">${s.name}<br>${s.city}</div></div><div class="sr"><span class="cat" id="${s.icao}-cat" hidden></span><span class="dot load" id="${s.icao}-dot"></span></div></div><section class="card"><h3>METAR — LAPORAN CUACA RUTIN</h3><div class="body"><p class="meta" id="${s.icao}-metar-meta"></p><pre id="${s.icao}-metar">Memuat…</pre><div class="chips" id="${s.icao}-chips"></div></div></section><section class="card"><h3>SPECI — LAPORAN CUACA KHUSUS</h3><div class="body"><p class="meta" id="${s.icao}-speci-meta"></p><pre id="${s.icao}-speci">Memuat…</pre></div></section><section class="card"><h3>TAF — PRAKIRAAN CUACA BANDARA</h3><div class="body"><p class="meta" id="${s.icao}-taf-meta"></p><pre id="${s.icao}-taf">Memuat…</pre></div></section></article>`).join('');

function obsDate(ddhhmm){const n=new Date(),d=+ddhhmm.slice(0,2),h=+ddhhmm.slice(2,4),m=+ddhhmm.slice(4,6);let t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),d,h,m));if(t-n>36e5*6)t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,d,h,m));return t;}
const wib=t=>`${pad((t.getUTCHours()+7)%24)}:${pad(t.getUTCMinutes())} WIB`;
const utc=t=>`${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())} UTC`;
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'baru saja';if(m<60)return m+' menit lalu';return Math.floor(m/60)+' jam '+(m%60)+' menit lalu';}
function setMeta(el,rep,label,extra){const m=rep.match(/\\b(\\d{6})Z/);if(!m){el.textContent='';return}const t=obsDate(m[1]),age=(Date.now()-t)/6e4,stale=label==='Observasi'&&age>90;el.textContent=`${label} ${utc(t)} (${wib(t)}) · ${ago(t)}`+(stale?' · data mungkin tertunda':'')+(extra?' · '+extra:'');el.className='meta'+(stale?' stale':'');}
function tick(){const n=new Date();$('clock').textContent=`${utc(n)} · ${wib(n)}`;}

// BARU 2026 - JSON API langsung
const clean=raw=>raw.replace(/<script[\\s\\S]*?<\\/script>/gi,' ').replace(/<\\/?(?:td|th|tr|br|p|div|li|pre|table|tbody|thead)\\b[^>]*>/gi,'\\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
function extract(raw,icao){try{const j=typeof raw==='string'?JSON.parse(raw):raw;if(Array.isArray(j)){const out=[];for(const it of j){if(!it.rawOb)continue;const txt=it.rawOb.trim();const mm=txt.match(/\\b(\\d{6})Z/);const time=mm?obsDate(mm[1]):(it.reportTime?new Date(it.reportTime):new Date());const type=/\\bSPECI\\b/.test(txt)?'SPECI':'METAR';out.push({type,text:txt,time});}if(out.length)return out.sort((a,b)=>b.time-a.time);}}catch(e){}const text=clean(raw);const re=new RegExp('(?:\\\\b(METAR|SPECI)\\\\s+(?:COR\\\\s+)?)?\\\\b'+icao+'\\\\s+(\\\\d{6})Z[^=\\\\n]*','g');const out=[],seen=new Set();for(const m of text.matchAll(re)){let s=m[0].trim();if(!m[1])s=(/\\bSPECI\\b/.test(text.slice(Math.max(0,m.index-14),m.index))?'SPECI':'METAR')+' '+s);s=s.replace(/\\s+/g,' ');if(seen.has(s))continue;seen.add(s);out.push({type:s.startsWith('SPECI')?'SPECI':'METAR',text:s,time:obsDate(m[2])});}return out.sort((a,b)=>b.time-a.time);}
function vdate(ref,d,h){let t=new Date(Date.UTC(ref.getUTCFullYear(),ref.getUTCMonth(),d,h,0));if(t<ref-864e5*2)t=new Date(Date.UTC(ref.getUTCFullYear(),ref.getUTCMonth()+1,d,h,0));return t;}
function extractTaf(raw,icao){try{const j=typeof raw==='string'?JSON.parse(raw):raw;if(Array.isArray(j)){const out=[];for(const it of j){const body=(it.rawTAF||it.rawOb||'').trim();if(!body)continue;const m=body.match(/\\b(\\d{6})Z/);const issued=m?obsDate(m[1]):new Date();const v=body.match(/Z\\s+(\\d{2})(\\d{2})\\/(\\d{2})(\\d{2})/);let from=null,to=null;if(v){from=vdate(issued,+v[1],+v[2]);to=vdate(from,+v[3],+v[4]);}out.push({text:body+'=',issued,from,to});}if(out.length)return out.sort((a,b)=>b.issued-a.issued);}}catch(e){}return [];}
async function tryEach(tries,errs,pick,icao){for(const [name,url] of tries){try{const r=await fetch(url,{cache:'no-store'});const t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status);const v=pick(t);if(v&&v.length)return{v,src:name};}catch(e){errs.push(name+': '+e.message);}}throw new Error('semua sumber gagal');}
const getReports=(i,errs)=>tryEach([['aviationweather.gov JSON',`https://aviationweather.gov/api/data/metar?ids=${i}&format=json`],['aviationweather.gov RAW',`https://aviationweather.gov/api/data/metar?ids=${i}&format=raw`]],errs,t=>extract(t,i),i);
const getTaf=(i,errs)=>tryEach([['aviationweather.gov JSON',`https://aviationweather.gov/api/data/taf?ids=${i}&format=json`],['aviationweather.gov RAW',`https://aviationweather.gov/api/data/taf?ids=${i}&format=raw`]],errs,t=>extractTaf(t,i),i);

function decode(s){const c=[];const add=(k,v)=>c.push(`<div class="chip"><b>${k}</b><span>${v}</span></div>`);let m;if(m=s.match(/\\b(VRB|\\d{3})(\\d{2,3})(?:G(\\d{2,3}))?KT\\b/)){const kt=+m[2];add('Angin',(m[1]==='VRB'?'Variabel':m[1]+'°')+' / '+kt+' kt'+` ≈ ${Math.round(kt*1.852)} km/j`);}if(/\\bCAVOK\\b/.test(s))add('Jarak pandang','≥ 10 km (CAVOK)');else if(m=s.match(/\\s(\\d{4})\\s/)){const v=+m[1];add('Jarak pandang',v>=9999?'≥ 10 km':(v>=1000?(v/1000)+' km':v+' m'))}const cl=[...s.matchAll(/\\b(FEW|SCT|BKN|OVC|VV)(\\d{3})(CB|TCU)?\\b/g)].map(x=>`${x[1]} ${+x[2]*100} ft${x[3]?' '+x[3]:''}`);if(/\\b(NSC|SKC|NCD)\\b/.test(s))add('Awan','Tidak ada awan signifikan');else if(cl.length)add('Awan',cl.join('<br>'));if(m=s.match(/\\s(M?\\d{2})\\/(M?\\d{2})\\s/)){const f=x=>x.startsWith('M')?-+x.slice(1):+x;add('Suhu / Embun',f(m[1])+'° / '+f(m[2])+'° C')}if(m=s.match(/\\bQ(\\d{4})\\b/))add('QNH',m[1]+' hPa');return c.join('');}
function flightCat(s){let vis=10000,m;if(!/\\bCAVOK\\b/.test(s)&&(m=s.match(/\\s(\\d{4})\\s/)))vis=+m[1];let ceil=Infinity;for(const x of s.matchAll(/\\b(BKN|OVC|VV)(\\d{3})\\b/g))ceil=Math.min(ceil,+x[2]*100);if(vis<1600||ceil<500)return 'LIFR';if(vis<4800||ceil<1000)return 'IFR';if(vis<8000||ceil<3000)return 'MVFR';return 'VFR';}
function render(i,list){const lm=list.find(x=>x.type==='METAR'),ls=list.find(x=>x.type==='SPECI'&&Date.now()-x.time<6*36e5);const cat=$(i+'-cat');if(lm){$(i+'-metar').textContent=lm.text;setMeta($(i+'-metar-meta'),lm.text,'Observasi');$(i+'-chips').innerHTML=decode(lm.text);const c=flightCat(lm.text);cat.textContent=c;cat.className='cat '+c;cat.hidden=false;}else{$(i+'-metar').textContent='Belum ada METAR dalam 24 jam terakhir.';cat.hidden=true;}if(ls){$(i+'-speci').textContent=ls.text;setMeta($(i+'-speci-meta'),ls.text,'Dikeluarkan');}else{$(i+'-speci').textContent='Tidak ada SPECI dalam 6 jam terakhir';}}
function renderTaf(i,list){if(!list.length){$(i+'-taf').textContent='TAF belum tersedia';return;}const now=Date.now();const valid=list.find(x=>x.from&&x.from<=now&&now<x.to);const main=valid||list[0];$(i+'-taf').textContent=main.text;setMeta($(i+'-taf-meta'),main.text,'Diterbitkan',main.from?`berlaku ${main.from.toUTCString()} - ${main.to.toUTCString()}`:'');}
async function loadStation(st){const i=st.icao,errs=[];let ok=true,msrc='';$(i+'-dot').className='dot load';try{const r=await getReports(i,errs);msrc=r.src;render(i,r.v);}catch(e){ok=false;$(i+'-metar').textContent='Gagal memuat METAR.\\n'+errs.join('\\n');}try{const r=await getTaf(i,errs);renderTaf(i,r.v);}catch(e){$(i+'-taf').textContent='TAF belum tersedia';}$(i+'-dot').className='dot '+(ok?'ok':'err');return{i,ok,msrc};}
async function load(){if(busy)return;busy=true;left=REFRESH;$('dot').className='dot load';$('status').textContent='Memperbarui…';$('btn').disabled=true;const res=await Promise.all(STATIONS.map(loadStation));const n=new Date(),ts=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;$('dot').className='dot ok';$('status').textContent=`Diperbarui ${ts} · ${res.map(r=>r.i+': '+r.msrc).join(' · ')}`;$('btn').disabled=false;busy=false;}
$('btn').onclick=load;setInterval(()=>{tick();if(document.hidden)return;if(--left<=0)load();else $('next').textContent='Auto-refresh '+left+' d';},1000);tick();load();
</script>
</body>
</html>
