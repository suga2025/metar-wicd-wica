<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METAR WICD WICA</title>
<style>body{font-family:system-ui,Arial;padding:24px;background:#fafafb}h1{font-size:22px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}.raw{font-family:monospace;background:#f5f5f5;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all}.meta{color:#666;font-size:12px}</style></head><body>
<h1>METAR, SPECI & TAF</h1><p style="color:#666;font-size:13px">Bandara Cakrabuana Cirebon (WICD) dan Kertajati Majalengka (WICA) - Real-time NOAA</p>
<div id="out">Memuat data...</div>
<script>
const PROXY='https://corsproxy.io/?';
const px=u=>PROXY+encodeURIComponent(u+'?t='+Date.now());
async function getTxt(url){
  const r=await fetch(px(url),{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return await r.text();
}
async function load(){
  const out=document.getElementById('out');
  out.innerHTML='Memuat...';
  let html='';
  for(const icao of ['WICD','WICA']){
    try{
      const url=`https://tgftp.nws.noaa.gov/data/observations/metar/stations/${icao}.TXT`;
      const txt=await getTxt(url);
      const lines=txt.trim().split('\n');
      const metar=lines[lines.length-1];
      let taf='-';
      try{
        const turl=`https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/${icao}.TXT`;
        const ttxt=await getTxt(turl);
        taf=ttxt.replace(/\n/g,' ').slice(0,800);
      }catch{}
      html+=`<div class=card><b style="font-size:18px">${icao}</b><div class=meta>${metar.match(/\b\d{6}Z\b/)||''} · ${new Date().toLocaleString('id-ID')}</div><div class=raw>${metar}</div><div class=meta style="margin-top:8px">TAF</div><div class=raw>${taf}</div></div>`;
    }catch(e){
      html+=`<div class=card><b>${icao}</b><br>Gagal: ${e.message}</div>`;
    }
  }
  out.innerHTML=html;
}
load();
setInterval(load,300000);
</script></body></html>
